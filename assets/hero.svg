<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12072b"/>
      <stop offset="60%" stop-color="#070311"/>
      <stop offset="100%" stop-color="#030107"/>
    </radialGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    
    <!-- Aurora Purple Gradient -->
    <linearGradient id="auroraPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </linearGradient>

    <!-- Aurora Gold Gradient -->
    <linearGradient id="auroraGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveSlow {
      0%, 100% { transform: translateY(0) scaleY(1) skewX(0deg); opacity: 0.7; }
      50% { transform: translateY(-15px) scaleY(1.08) skewX(3deg); opacity: 0.9; }
    }
    @keyframes waveFast {
      0%, 100% { transform: translateY(0) scaleY(1) skewX(0deg); opacity: 0.6; }
      50% { transform: translateY(10px) scaleY(0.92) skewX(-4deg); opacity: 0.85; }
    }
    @keyframes waveGold {
      0%, 100% { transform: translateY(0) scaleY(1) translateX(0); opacity: 0.5; }
      50% { transform: translateY(-8px) scaleY(1.05) translateX(20px); opacity: 0.75; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .aurora-purple-1 {
      animation: waveSlow 8s infinite ease-in-out;
      transform-origin: bottom center;
    }
    .aurora-purple-2 {
      animation: waveFast 11s infinite ease-in-out;
      transform-origin: bottom center;
    }
    .aurora-gold {
      animation: waveGold 9s infinite ease-in-out;
      transform-origin: bottom center;
    }
    .star {
      animation: blink 4s infinite ease-in-out;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>

  <!-- Twinkling Cosmic Stars -->
  <g fill="#ffffff" fill-opacity="0.4">
    <circle cx="90" cy="40" r="1" class="star" style="animation-delay: 0.2s;"/>
    <circle cx="180" cy="70" r="2.5" class="star" style="animation-delay: 1.5s;" fill="#fde047"/>
    <circle cx="280" cy="30" r="1.5" class="star" style="animation-delay: 0.8s;"/>
    <circle cx="360" cy="80" r="1" class="star" style="animation-delay: 2.3s;"/>
    <circle cx="450" cy="40" r="2" class="star" style="animation-delay: 0s;"/>
    <circle cx="520" cy="90" r="1.5" class="star" style="animation-delay: 3s;"/>
    <circle cx="680" cy="50" r="2" class="star" style="animation-delay: 1.2s;"/>
    <circle cx="740" cy="80" r="1" class="star" style="animation-delay: 1.8s;"/>
  </g>

  <!-- Animated Aurora Waves -->
  <!-- Aurora Wave 1 (Purple - back) -->
  <path d="M 300 240 Q 420 100 550 110 T 800 90 L 800 240 L 300 240 Z" fill="url(#auroraPurple)" class="aurora-purple-1" filter="url(#glow)"/>

  <!-- Aurora Wave 2 (Gold - middle) -->
  <path d="M 250 240 Q 380 80 500 120 T 750 100 L 750 240 L 250 240 Z" fill="url(#auroraGold)" class="aurora-gold" filter="url(#glow)"/>

  <!-- Aurora Wave 3 (Purple - front) -->
  <path d="M 350 240 Q 480 120 620 90 T 800 120 L 800 240 L 350 240 Z" fill="url(#auroraPurple)" class="aurora-purple-2" filter="url(#glow)"/>

  <!-- Mountain Silhouette (Foreground) -->
  <path d="M 0 300 L 0 250 L 80 230 L 170 260 L 250 220 L 340 250 L 450 210 L 580 260 L 680 230 L 800 260 L 800 300 Z" fill="#070312"/>
  <path d="M 0 300 L 0 260 L 110 245 L 200 270 L 300 235 L 420 265 L 520 225 L 630 270 L 720 245 L 800 275 L 800 300 Z" fill="#0c071d" opacity="0.6"/>

  <!-- Typography / Brand Titles -->
  <g transform="translate(60, 90)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7" letter-spacing="4" opacity="0.9">
      ATMOSPHERIC MINECRAFT SHADERS
    </text>
    <text x="-2" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#goldGrad)" letter-spacing="1" filter="url(#glow)">
      AuroralisStar
    </text>
    <text x="0" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="300" fill="#ffffff" opacity="0.8" letter-spacing="0.5">
      Fork Estilizado Enfocado en Presets de Hardware y Auroras
    </text>
  </g>

  <!-- Status / Pipeline Indicator -->
  <g transform="translate(60, 240)">
    <circle cx="10" cy="10" r="5" fill="#eab308" filter="url(#glow)" class="star"/>
    <text x="25" y="14" font-family="monospace" font-size="12" fill="#eab308" font-weight="bold" letter-spacing="1">
      STATUS: ACTIVE [LAPTOP-MX450 &amp; DESKTOP-RTX4060 PIPELINES]
    </text>
  </g>
</svg>
